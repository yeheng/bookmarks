[package]
name = "launcher-app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "launcher_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# rusqlite is only used for: (1) one-time migration from old SQLite DB to JSON,
# (2) Firefox bookmark import (reads Firefox's places.sqlite).
# It can be fully removed once migration support is dropped.
rusqlite = { version = "0.38", features = ["bundled"] }
tokio = { version = "1", features = ["full"] }
dirs = "6"
plist = "1"
reqwest = { version = "0.13.2", features = ["blocking"] }
url = "2"
notify = "8"
open = "5"
tantivy = "0.25.0"
async-trait = "0.1"
futures = "0.3"
thiserror = "2"
toml = "0.9.8"
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tempfile = "3.25.0"

